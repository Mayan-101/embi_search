<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embi Search</title>
    <style>
        :root {
            --bg-color: rgba(30, 30, 30, 0.95);
            --text-color: #ffffff;
            --highlight: #4a90e2;
        }
        body {
            margin: 0;
            padding: 0;
            background: transparent; /* Allows window to be transparent */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            overflow: hidden;
        }
        .search-container {
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 100vh;
            border: 1px solid rgba(255,255,255,0.1);
        }
        input {
            width: 100%;
            padding: 20px;
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            outline: none;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        #results {
            flex-grow: 1;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .result-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .result-item:hover, .result-item.active {
            background: rgba(255,255,255,0.1);
            border-left: 4px solid var(--highlight);
        }
        .file-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .snippet {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search semantically..." autofocus autocomplete="off">
        <ul id="results"></ul>
    </div>

    <script>
        const { invoke } = window.__TAURI__.tauri;

        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('results');
        let timeout = null;

        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            const query = e.target.value;
            
            if (query.trim() === '') {
                resultsList.innerHTML = '';
                return;
            }

            // Debounce the search so we don't spam the ML model on every keystroke
            timeout = setTimeout(async () => {
                try {
                    const results = await invoke('search_files', { query });
                    renderResults(results);
                } catch (err) {
                    console.error("Search failed:", err);
                }
            }, 300); 
        });

        function renderResults(results) {
            resultsList.innerHTML = '';
            results.forEach(result => {
                const li = document.createElement('li');
                li.className = 'result-item';
                
                // Extract just the filename from the path
                const fileName = result.file_path.split('\\').pop().split('/').pop();

                li.innerHTML = `
                    <div class="file-name">${fileName}</div>
                    <div class="snippet">${result.content_snippet.substring(0, 100)}...</div>
                `;
                
                // Native Open
                li.onclick = () => {
                    invoke('open_file', { path: result.file_path });
                };
                
                resultsList.appendChild(li);
            });
        }
    </script>
</body>
</html>
