[package]
name = "embi_search"
version = "0.1.0"
edition = "2024"

[lib]
name = "embi_search"
path = "src/lib.rs"

[[bin]]
name = "embi_search"
path = "src/main.rs"

[dependencies]
arrow = "57.3.0"
arrow-array = "57.3.0"
arrow-schema = "57.3.0"
futures = "0.3.32"
lancedb = "0.26.2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.1", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
